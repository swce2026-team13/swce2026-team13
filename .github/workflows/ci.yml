name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campass
          POSTGRES_DB: campass_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campass -d campass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://campass@127.0.0.1:5432/campass_test
      GEMINI_API_KEY: ""
      GEMINI_MODEL: ""
      VISION_API_URL: ""
      INTENT_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: campass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: campass/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node node_modules/next/dist/bin/next typegen
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:api
