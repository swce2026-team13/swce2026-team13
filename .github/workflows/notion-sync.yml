name: Sync GitHub issues and PRs to Notion

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  pull_request_target:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, ready_for_review, converted_to_draft, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/notion-sync.yml']

# Read-only GitHub access. The Notion token is confined to this job.
permissions:
  contents: read
  issues: read
  pull-requests: read

# Every run reconciles all items, so even coalesced pending events are recovered.
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deliberately no checkout: PR branches and their code are never executed.
      - name: Reconcile GitHub metadata into Notion
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """GitHub -> Notion metadata sync. No PR checkout or execution of user content."""
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from collections import Counter
          
          DATA_SOURCE = 'eb675e09-d84e-4904-8913-02698ddc82e9'
          SCHEMA = {'제목': 'title', '번호': 'number', '유형': 'select', '상태': 'select',
                    '링크': 'url', '작성자': 'rich_text', '담당자': 'rich_text', '라벨': 'multi_select',
                    '브랜치': 'rich_text', '기능 ID': 'rich_text', '생성일': 'date', '종료일': 'date'}
          
          
          def rich(text):
              return [{'type': 'text', 'text': {'content': str(text)[:1900]}}] if text else []
          
          
          def properties(value):
              pr = 'head' in value
              status = ('머지됨' if value.get('merged_at') else '닫힘' if value['state'] == 'closed'
                        else '초안' if pr and value.get('draft') else '열림')
              ids = sorted(set(re.findall(r'(?<![A-Z0-9])(?:NFR|FR)-\d+',
                                         (value['title'] + '\n' + (value.get('body') or '')).upper())))
              return {
                  '제목': {'title': rich(value['title'])}, '번호': {'number': value['number']},
                  '유형': {'select': {'name': 'PR' if pr else '이슈'}},
                  '상태': {'select': {'name': status}}, '링크': {'url': value['html_url']},
                  '작성자': {'rich_text': rich((value.get('user') or {}).get('login', ''))},
                  '담당자': {'rich_text': rich(', '.join(x['login'] for x in value.get('assignees', [])))},
                  '라벨': {'multi_select': [{'name': name} for name in sorted(set(
                      x['name'].replace(',', '，')[:100] for x in value.get('labels', [])))]},
                  '브랜치': {'rich_text': rich(value.get('head', {}).get('ref', ''))},
                  '기능 ID': {'rich_text': rich(', '.join(ids))},
                  '생성일': {'date': {'start': value['created_at']}},
                  '종료일': {'date': {'start': value.get('merged_at') or value['closed_at']}
                           if value.get('merged_at') or value.get('closed_at') else None},
              }
          
          
          def normalized(value):
              result = {}
              for key, kind in SCHEMA.items():
                  field = value.get(key, {}).get(kind)
                  if kind in ('title', 'rich_text'):
                      field = ''.join(x.get('text', {}).get('content', x.get('plain_text', '')) for x in field or [])
                  elif kind == 'select':
                      field = (field or {}).get('name')
                  elif kind == 'multi_select':
                      field = sorted(x['name'] for x in field or [])
                  elif kind == 'date':
                      field = (field or {}).get('start')
                      if field:
                          from datetime import datetime
                          field = datetime.fromisoformat(field.replace('Z', '+00:00')).isoformat()
                  result[key] = field
              return result
          
          
          def upsert(value, rows, request):
              url = value['html_url']
              props = properties(value)
              existing = rows.get(url)
              if existing and normalized(existing['properties']) == normalized(props):
                  return 'unchanged'
              if existing:
                  request('PATCH', '/pages/' + existing['id'], {'properties': props})
                  result = 'updated'
              else:
                  created = request('POST', '/pages', {
                      'parent': {'type': 'data_source_id', 'data_source_id': DATA_SOURCE}, 'properties': props})
                  rows[url] = {'id': created['id'], 'properties': props}
                  result = 'created'
              rows[url]['properties'] = props
              return result
          
          
          def api(origin, token, notion=False):
              def request(method, path, body=None):
                  headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json',
                             'User-Agent': 'swce2026-notion-sync'}
                  headers.update({'Notion-Version': '2025-09-03'} if notion else
                                 {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  for attempt in range(5):
                      if notion:
                          time.sleep(0.4)
                      req = urllib.request.Request(origin + path, method=method, headers=headers,
                                                   data=json.dumps(body).encode() if body is not None else None)
                      try:
                          with urllib.request.urlopen(req, timeout=40) as response:
                              return json.load(response)
                      except urllib.error.HTTPError as exc:
                          # Do not retry ambiguous page creation responses: reruns re-read the DB first.
                          if (exc.code == 429 or (exc.code >= 500 and method != 'POST')) and attempt < 4:
                              time.sleep(min(60, float(exc.headers.get('Retry-After', 2 ** (attempt + 1)))))
                              continue
                          # Never print tokens, request headers, issue bodies or API response bodies.
                          raise RuntimeError(f'{"Notion" if notion else "GitHub"} {method} {path}: HTTP {exc.code}') from None
                  raise RuntimeError('Retry limit reached')
              return request
          
          
          def run():
              repo = os.environ['GITHUB_REPOSITORY']
              token = os.environ.get('NOTION_TOKEN', '').strip()
              if not token:
                  raise RuntimeError('Missing repository secret NOTION_TOKEN')
              notion = api('https://api.notion.com/v1', token, True)
              github = api('https://api.github.com', os.environ['GH_TOKEN'])
              schema = notion('GET', '/data_sources/' + DATA_SOURCE)['properties']
              for name, kind in SCHEMA.items():
                  if schema.get(name, {}).get('type') != kind:
                      raise RuntimeError('Notion database property missing or changed: ' + name)
              rows, cursor = {}, None
              while True:
                  query = {'page_size': 100}
                  if cursor:
                      query['start_cursor'] = cursor
                  page = notion('POST', '/data_sources/' + DATA_SOURCE + '/query', query)
                  for row in page['results']:
                      url = row['properties'].get('링크', {}).get('url')
                      if url and url.startswith('https://github.com/' + repo + '/'):
                          if url in rows:
                              raise RuntimeError('Duplicate GitHub URL in Notion; resolve duplicate rows before syncing')
                          rows[url] = row
                  if not page.get('has_more'):
                      break
                  cursor = page['next_cursor']
              totals = Counter()
              page_number = 1
              while True:
                  issues = github('GET', f'/repos/{repo}/issues?state=all&per_page=100&page={page_number}')
                  if not issues:
                      break
                  for value in issues:
                      if 'pull_request' in value:
                          value = github('GET', f'/repos/{repo}/pulls/{value["number"]}')
                      totals[upsert(value, rows, notion)] += 1
                  page_number += 1
              summary = ('Notion sync complete: created={created}, updated={updated}, unchanged={unchanged}'
                         .format(**{k: totals[k] for k in ('created', 'updated', 'unchanged')}))
              print(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                      output.write('## GitHub → Notion\n\n' + summary + '\n')
          
          
          if __name__ == '__main__':
              run()
          PYTHON
